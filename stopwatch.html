<!DOCTYPE html>
<html>
<head>
<title>Stopwatch</title>
<style>
body{
    font-family: Arial, sans-serif;
    text-align: center;
    background-color: #08923b;
}

.container{
    margin-top: 100px;
    background: rgb(188, 6, 40);
    padding: 30px;
    width: 300px;
    margin-left: auto;
    margin-right: auto;
    border-radius: 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

#display{
    font-size: 40px;
    font-weight: bold;
    margin: 20px;
}

button{
    padding: 10px 15px;
    margin: 5px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    color: rgb(26, 4, 70);
}

.start{background: green;}
.stop{background: crimson;}
.reset{background: orange;}
.lap{background: dodgerblue;}

li{
    list-style: none;
    padding: 5px;
}
</style>
</head>

<body>

<div class="container">
    <h1>Stopwatch</h1>

    <div id="display">00:00:00</div>

    <button class="start" onclick="start()">Start</button>
    <button class="stop" onclick="stop()">Stop</button>
    <button class="reset" onclick="reset()">Reset</button>
    <button class="lap" onclick="lap()">Lap</button>

    <h2>Lap Times</h2>
    <ul id="laps"></ul>
</div>

<script>
let sec = 0;
let timer = null;

function update(){
    sec++;

    let h = Math.floor(sec / 3600);
    let m = Math.floor((sec % 3600) / 60);
    let s = sec % 60;

    document.getElementById("display").innerHTML =
        String(h).padStart(2,'0') + ":" +
        String(m).padStart(2,'0') + ":" +
        String(s).padStart(2,'0');
}

function start(){
    if(timer === null){
        timer = setInterval(update,1000);
    }
}

function stop(){
    clearInterval(timer);
    timer = null;
}

function reset(){
    clearInterval(timer);
    timer = null;
    sec = 0;
    document.getElementById("display").innerHTML = "00:00:00";
    document.getElementById("laps").innerHTML = "";
}

function lap(){
    let li = document.createElement("li");
    li.innerText = document.getElementById("display").innerText;
    document.getElementById("laps").appendChild(li);
}
</script>

</body>
</html>
